  <main class="review">
    <header class="masthead">
      <div><div class="wordmark"><img data-brand alt=""><span>Remote</span></div><h1>手机连接</h1></div>
      <div class="controls">
        <div class="theme-switch" aria-label="配色预览">
          <button data-theme="dark" aria-pressed="true">深色</button>
          <button data-theme="light" aria-pressed="false">浅色</button>

          <option value="home">设备</option><option value="pair">配对</option><option value="settings">设置</option>

          <option value="empty">0 台设备</option><option value="long">长设备名</option>

        </select>
        <button class="control" id="reset">重置</button>
      </div>
    </header>
    <div class="gallery" id="gallery"></div>
    <footer class="review-footer">
      <button class="control" id="simulate-pair">模拟完成配对</button>
      <button class="control" id="preview-mobile">手机启动</button>
    </footer>
  </main>

      <button class="control" id="close-context">返回预览</button><strong id="context-label"></strong>

    <div class="context-app" id="context-app"></div>
  </dialog>

l-body\">\n    \u003cp class=\"prompt-description\" id=\"confirmContent\">\u003c/p>\n    \u003cdiv class=\"confirm-actions\">\u003cbutton class=\"prompt-choice\" type=\"button\" id=\"confirmCancelBtn\">取消\u003c/button>\u003cbutton class=\"prompt-choice primary\" type=\"button\" id=\"confirmAcceptBtn\">确认\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\" hidden>\u003csvg class=\"icon\" id=\"noticeIcon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7.5v5M12 16h.01\"/>\u003c/svg>\u003cspan id=\"noticeText\">\u003c/span>\u003cbutton id=\"noticeRetryBtn\" type=\"button\" hidden>重试\u003c/button>\u003cbutton id=\"noticeOpenBtn\" type=\"button\" aria-label=\"查看其他对话待处理项\" hidden>查看\u003c/button>\u003cbutton id=\"noticeDismissBtn\" type=\"button\" aria-label=\"关闭提示\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m7 7 10 10m0-10L7 17\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cnoscript>\u003cp style=\"max-width:600px;margin:20px auto;padding:0 16px;color:#a13340\">此页面需要启用 JavaScript 才能显示控制台。\u003c/p>\u003c/noscript>\n\n\u003cscript>\n'use strict';\n(function(){\n  var TOKEN_KEY = 'chatgpt-harmony-demo-token';\n  var SUBMIT_KEY = 'chatgpt-harmony-submit-method';\n  var DELIVERY_KEY = 'chatgpt-harmony-pending-send';\n  var DRAFTS_KEY = 'chatgpt-remote-drafts-v1';\n  var SURFACE_KEY = 'chatgpt-remote-phone-surface';\n  var LONG_PRESS_MS = 550;\n  var CLICK_SLOP = 12;\n  var WINDOW_REFRESH_MS = 5000;\n  var REQUEST_TIMEOUT_MS = 8000;\n  var NAVIGATION_TIMEOUT_MS = 25000;\n  var MODEL_APPLY_TIMEOUT_MS = 35000;\n  var CONTROL_HANDSHAKE_MS = 5000;\n  var CONTROL_HEARTBEAT_MS = 6000;\n  var CHAT_POLL_MS = 1600;\n  var CHAT_STREAM_RETRY_MS = 6000;\n  var FRAME_STALE_MS = 4000;\n  var MAX_TEXT = 6000;\n  var ALLOWED_STATUS = { ready: true, rebound: true, desktop: true };\n  var DESKTOP_TIP = '完整桌面模式可查看并操作整块    lastActionFrame: { sequence: 0, at: 0 },\n    responseLatency: null,\n    live: false,\n    epoch: -1,\n    displayedEpoch: -1,\n    displayedFrameId: 0,\n    lastFrameId: 0,\n    frameSeen: false,\n    lastFrameAt: 0,\n    latency: null,\n    frameTimes: [],\n    frameW: 0,\n    frameH: 0,\n    windows: [],\n    windowSig: '',\n    pickId: null,\n    mode: 'window',\n    status: '',\n    frozen: { active: false, until_ms: 0, reason: '' },\n    version: '',\n    mock: false,\n    immersive: false,\n    networkTrouble: false,\n    offline: false,\n    pageSuspended: false,\n    error: '',\n    errorSource: '',\n    sessionEnded: false,\n    freezeExpiryHandled: false,\n    windowSigRefreshAt: 0,\n    lastWindowsRefresh: 0,\n    refreshSeq: 0,\n    refreshAbort: null,\n    frameAbort: null,\n    windowTimer: 0,\n    statsTimer: 0,\n    gate: { ok: false, reason: '正在连接…' },\n    actionsInFlight: 0,\n    streamAck: null,\n    sending: null,\n    instance: '',\n    retiredInstances: new Set(),\n    pending: { pair: false, refresh: false, select: false, desktop: false, freeze: false, unpair: false, sendText: false }\n  };\n\n  /* ---------- 基础工具 ---------- */\n  function controlIcon(name){\n    var paths={image:'M3 3h18v18H3ZM3 16l5-5 4 4 3-3 6 6M15 7h.01',file:'M5 3h9l5 5v13H5ZM14 3v6h5',folder:'M3 7V5h6l2 2h10v13H3Z',chat:'M4 4h16v13H8l-4 3Z',chevron:'m9 6 6 6-6 6',down:'m6 9 6 6 6-6',check:'m5 12 4 4L19 6',plus:'M12 5v14M5 12h14',model:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z',permission:'m12 3 8 3v5c0 5-8 10-8 10S4 16 4 11V6Z',effort:'M4 7h16M4 17h16M9 4v6m6 4v6'};\n    paths.bolt='m13 2-9 12h7l-1 8 10-12h-7Z';\n    paths.search='M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15ZM16 16l5 5';\n    paths.terminal='M4 5h16v14H4ZM8 9l3 3-3 3m5 0h3';\n    paths.tools='M8 4v4m-2-2h4m6 10v4m-2-2h4m-6-8 4 4m0-4-4 4';\n    paths.trash='M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6';\n    paths.steer='M4 5v5c0 2     case "copy":
    case "copy-pin":
      await copyPairing(id, control.dataset.action === "copy-pin" ? "pin" : "link");
      return;
    case "update":
      checkUpdate(id);
      return;
    case "uninstall":
      if (!state.uninstallConfirm) {
        state.uninstallConfirm = true;
        render(id);
        window.clearTimeout(state.uninstallTimer);
        state.uninstallTimer = window.setTimeout(() => {
          if (states[id] !== state) return;
          state.uninstallConfirm = false;
          render(id);
        }, 3200);
        return;
      }
      window.clearTimeout(state.uninstallTimer);
      state.uninstallConfirm = false;
      if (nativePanel && !await changeNative(state, "settings.remove")) {
        render(id);
        return;
      }
      state.uninstalled = true;
      render(id);
      return;
    default:
      return;
  }
  render(id);
}

function wirePanelEvents() {
  document.addEventListener("pointerdown", event => {
    const panel = event.target.closest(".panel");
    for (const [id, state] of Object.entries(states)) {
      const samePanel = panel?.dataset.panel === id;
      let changed = false;
      if (state.settings && !(samePanel && event.target.closest(".settings,[data-action=settings]"))) {
        state.settings = false;
        state.uninstallConfirm = false;
        changed = true;
      }
      const removal = event.target.closest("[data-action=remove]")?.closest(".device-card");
      if (state.phase === "remove" && !(samePanel && removal?.dataset.deviceId === state.activeId)) {
        clearDeviceAction(state);
        changed = true;
      }
      if (changed) render(id);
    }
  });
  document.addEventListener("click", event => {
    const control = event.target.closest("button[data-action]");
    const panel = control?.closest(".panel");
    if (panel) void handleAction(panel, control);
  });
  document.addEventListener("input", event => {
    if (event.target.matches(".card-input")) {
      states[event.target.closest(".panel").dataset.panel].draft = event.target.value;
    }
  });
  document.addEventListener("keydown", event => {
    if (event.isComposing) return;
    const panel = event.target.closest?.(".panel") || (nativePanel ? document.querySelector(".panel") : null);
    if (!panel) return;
    const state = states[panel.dataset.panel];
    if (event.key === "Enter" && event.target.matches(".card-input")) {
      event.preventDefault();
      if (!state.busy) void saveName(panel);
      return;
    }
    if (event.key !== "Escape") return;
    if (!state.phase && !state.settings) {
      if (nativePanel) window.chrome.webview.postMessage({ operation: "dismiss" });
      return;
    }
    event.preventDefault();
    const device = state.activeId;
    const settingsOpen = state.settings;
    clearDeviceAction(state);
    state.settings = false;
    state.uninstallConfirm = false;
    render(panel.dataset.panel);
    if (device) focusCard(panel, device, "button.card-name");
    else if (settingsOpen) panel.querySelector("[data-action=settings]").focus({ preventScroll: true });
  });
}


const gallery = document.getElementById("gallery");
for (const [id, layout] of Object.entries(layouts)) {
  states[id] = newState();
  const article = document.createElement("article");
  article.className = "scheme";
  article.innerHTML = '<div class="scheme-heading"><h2>' + layout.name + "</h2></div>"
    + '<div class="stage">' + rail() + '<div class="stage-caption">' + icon("panel-left") + 'ChatGPT</div><div class="mount"></div></div>'
    + '<div class="scheme-actions"><button class="control" data-context="' + id + '">' + icon("arrow-up-right")
    + '在 ChatGPT 中预览</button></div>';
  gallery.append(article);
  mountPanel(article.querySelector(".mount"), id);
}
updateMarks();
wirePanelEvents();
document.addEventListener("click", event => {
  const control = event.target.closest("button");
  if (control?.dataset.context) showDesktop(control.dataset.context);
  if (!control?.matches(".theme-switch button")) return;
  document.documentElement.dataset.theme = control.dataset.theme;
  document.querySelectorAll(".theme-switch button").forEach(button => button.setAttribute("aria-pressed", String(button === control)));
  updateMarks();
});
const sceneChoice = document.getElementById("scene-choice");
const scenarioChoice = document.getElementById("scenario-choice");
function resetStates() {
  for (const id of Object.keys(layouts)) {
    window.clearTimeout(states[id].noticeTimer);
    window.clearTimeout(states[id].copyTimer);
    states[id] = newState();
    document.querySelectorAll('[data-panel="' + id + '"] .device-track').forEach(track => { track.scrollLeft = 0; });
    setScene(id, sceneChoice.value);
  }
}
sceneChoice.addEventListener("change", () => {
  for (const id of Object.keys(layouts)) {
    document.querySelectorAll('[data-panel="' + id + '"] .device-track').forEach(track => { track.scrollLeft = 0; });
    setScene(id, sceneChoice.value);
  }
});
scenarioChoice.addEventListener("change", () => { scenario = scenarioChoice.value; resetStates(); });
document.getElementById("reset").addEventListener("click", () => {
  scenario = scenarioChoice.value = "normal";
  sceneChoice.value = "home";
  resetStates();
});
document.getElementById("simulate-pair").addEventListener("click", () => {
  for (const [id, state] of Object.entries(states)) {
    if (Date.now() >= state.expiresAt || state.paused) continue;
    state.devices.push({ id: String(Math.max(0, ...state.devices.map(device => Number(device.id))) + 1), name: "新手机" });
    state.pairIndex++;
    state.expiresAt = Date.now() + pairLifetime * 1000;
    setScene(id, "home");
    notify(id, "配对成功");
  }
});
document.getElementById("close-context").addEventListener("click", () => dialog.close());
document.getElementById("preview-mobile").addEventListener("click", showMobile);
document.getElementById("replay-mobile").addEventListener("click", showMobile);
dialog.addEventListener("close", () => { contextApp.replaceChildren(); });
window.setInterval(() => {
  for (const [id, state] of Object.entries(states)) {
    if (scenario !== "expired" && !state.paused && Date.now() >= state.expiresAt) {
      state.pairIndex++;
      state.expiresAt = Date.now() + pairLifetime * 1000;
      state.copied = "";
      window.clearTimeout(state.copyTimer);
      render(id);
    } else {
      document.querySelectorAll('[data-panel="' + id + '"]').forEach(panel => paintPairing(panel, state));
    }
  }
}, 250);
  </script>
