function pairPoster(s){

  action=phase==='stale'?'retry':(phase==='stopped'||phase==='failed')?'start':(state.pairError?'renew-pair':'');
  label=phase==='failed'?'重试启动':state.starting?'启动中…':phase==='stale'?'重新连接':state.pairError?'重新生成配对码':phase==='preparing'?'正在准备配对码':'启动服务';

  ?`<div class="qr"><img src="${esc(p.qr)}" alt="手机连接二维码"></div>`
  :`<div class="qr-slot">${icon(phase==='stale'?'refresh':phase==='preparing'?'qr':'power')}</div>`;

  ?`<span class="pin"><b>${esc(p.pin.slice(0,3)+' '+p.pin.slice(3))}</b><button class="icon" data-action="copy-code" aria-label="复制配对码" title="复制配对码">${icon('copy')}</button></span>`
  :action?`<button class="poster-action" data-action="${action}" data-operation ${state.starting?'disabled':''}>${label}</button>`
  :`<span class="poster-action is-static">${label}</span>`;

   ?`<span class="timer"><i class="ring" aria-hidden="true"></i><small id="pair-expiry">…</small><button class="text-action" data-action="renew-pair">${state.pairError?'重试':'刷新'}</button></span>`

async function startService(){
 if(state.busy||state.starting)return;
 statusGeneration++;
 state.starting=true;state.startError='';setBusy(true);render();
 try{
  const result=await call('service.start');
  state.status={...state.status,...result};state.statusStale=false;
 }catch(error){state.startError=error.message;}
 finally{
  state.starting=false;setBusy(false);render();
  if(state.status.running)ensurePair();
 }
}

function focusInline(context,select=false){

  input.focus({preventScroll:true});

function beginInline(kind,device=null){

async function saveInline(){
 const context=state.inline;
 if(!context||state.busy)return;
 const input=$('#inline-name');
 if(input&&context.kind!=='remove')context.selection={start:input.selectionStart,end:input.selectionEnd};
 const value=(input?.value??context.value).trim();
 context.value=value;
 if(context.kind!=='remove'&&!value){context.error='请输入名称';render();focusInline(context);return;}
 if(context.kind!=='computer'&&(!state.status.running||statusIsStale())){context.error='连接恢复后再试';render();focusInline(context);return;}
 let nextDevice=null;
 statusGeneration++;
 context.saving=true;context.error='';setBusy(true);render();
 try{
  if(context.kind==='computer'){
   const result=await call('settings.computerName',{computerName:value});
   state.status.computerName=value;
   state.status.preferences={...state.status.preferences,...result.preferences};
  }else if(context.kind==='rename'){
   await call('device.rename',{id:context.id,name:value});
   const device=state.status.devices.find(d=>d.id===context.id);if(device)device.name=value;
  }else{
    const index=state.status.devices.findIndex(d=>d.id===context.id);
    nextDevice=state.status.devices[index+1]?.id||state.status.devices[index-1]?.id||null;
   await call('device.remove',{id:context.id});
   state.status.devices=state.status.devices.filter(d=>d.id!==context.id);
  }
  state.inline=null;
 }catch(error){context.error=error.message;}
 finally{
  context.saving=false;setBusy(false);render();syncInteraction();
   animateInlineResult(context);
   if(canFocusPanel()&&focusIsUnclaimed()){
    if(state.inline)focusInline(context);
    else if(context.kind==='remove'){
    const target=[...document.querySelectorAll('[data-action=device-menu]')].find(node=>node.dataset.id===nextDevice)||$('[data-action=add-device]');
    target?.focus({preventScroll:true});
    }
   }
 }
}

function closeDeviceMenu(restoreFocus=false) {
 if (!deviceMenuTrigger) return;
 const trigger=deviceMenuTrigger;
 deviceMenuTrigger=null;

 if (restoreFocus && trigger.isConnected) trigger.focus({preventScroll:true});
}
function positionDeviceMenu() {
 if (!deviceMenuTrigger) return;
 const anchor=deviceMenuTrigger.getBoundingClientRect();
 const shell=$('#shell').getBoundingClientRect(), list=$('#main').getBoundingClientRect();
 const menu=$('#device-menu'),rect=menu.getBoundingClientRect(),box={width:menu.offsetWidth||rect.width,height:menu.offsetHeight||rect.height},gap=4;
 if (anchor.bottom<=list.top || anchor.top>=list.bottom) {closeDeviceMenu();return;}
 const below=anchor.bottom+gap;
 const top=below+box.height<=list.bottom ? below : anchor.top-gap-box.height;
 const left=Math.max(list.left+gap,Math.min(anchor.right-box.width,list.right-gap-box.width));
 menu.style.top=Math.max(list.top+gap,top)+'px';
 menu.style.left=left+'px';
}
function toggleDeviceMenu(trigger) {

}
function settings(s){const pref=s.preferences||{},appearance=state.appearanceOpen;const auto=state.settings?state.settings.autoStart:(typeof s.autoStart==='boolean'?s.autoStart:null);return `<div class="page"><section class="group"><div class="section-label">系统</div><div class="settings-list"><div class="toggle-row"><span class="grow">开机自启</span>${auto===null?'<button id="startup-loading" class="text-action" data-action="retry-settings" aria-label="读取开机自启状态" disabled>读取中…</button>':''}<button class="switch" role="switch" aria-label="开机自启" aria-checked="${!!auto}" data-action="autostart" ${auto===null?'hidden disabled':''}></button></div><section class="disclosure"><button class="link-row" data-action="appearance" aria-expanded="${appearance}"><span class="grow">外观</span><span id="appearance-summary" class="end">${({system:'系统',light:'浅色',dark:'深色'})[pref.theme]||'系统'}</span>${icon('right')}</button><div class="disclosure-body" id="appearance-body" ${appearance?'':'hidden'}>${segment('theme',[['system','系统'],['light','浅色'],['dark','深色']],pref.theme||'system')}${segment('material',[['glass','磨砂玻璃'],['solid','纯色']],pref.material||'glass')}<div class="toggle-row motion-setting"><span class="grow">界面动效</span><button class="switch" role="switch" aria-label="界面动效" aria-checked="${pref.motion!==false}" data-action="motion"></button></div></div></section></div></section><section class="group"><div class="section-label">关于</div><div class="settings-list"><button class="link-row" data-action="update"><span class="grow">版本更新</span><span class="end">${s.update?.status==='available'?'有新版本':''}</span>${icon('right')}</button><button class="link-row" data-action="first-use"><span class="grow">使用说明</span>${icon('right')}</button><button class="link-row" data-action="support"><span class="grow">联系与支持</span>${icon('right')}</button><button class="link-row" data-action="uninstall"><span class="grow">卸载程序</span>${icon('right')}</button></div></section></div>`;}
function support(s){return `<div class="purchase-page"><section class="purchase-contact"><h3>咨询</h3><p class="purchase-services">使用咨询 · 问题反馈</p><div class="purchase-number"><label for="support-qq">QQ号：</label><input id="support-qq" class="purchase-qq" aria-label="QQ号" value="210037309" readonly spellcheck="false"></div><p class="purchase-note">添加时请备注“ChatGPT Remote”</p><button class="primary purchase-copy" data-action="copy-qq">${icon('copy')}复制 QQ 号</button><button class="purchase-feedback" data-action="issues">在 GitHub 反馈问题</button></section><section class="card support-card"><div class="support-copy"><h3>打赏作者</h3><p>如果这个工具帮到了你，<br>欢迎随意打赏。</p><p class="support-scan">支付宝 · 点击放大</p></div><button class="support-code" data-action="support-qr" aria-label="放大支付宝打赏码"><img src="${supportQr}" alt="支付宝打赏码"></button></section></div>`;}
function supportQrView(){return `<div class="page"><img class="support-full-code" src="${supportQr}" alt="支付宝收款二维码"><p class="purchase-note" style="text-align:center">打开支付宝扫一扫</p></div>`;}
/*REMOTE_LIFECYCLE*/
function render(){
 const s=state.status;if(!s)return;
 const focus=rememberFocus(),main=$('#main'),scroll=main.scrollTop;
 if(s.installation?.firstRun){state.page='install';state.history=[];}else if(s.requestedPage){state.page=s.requestedPage;s.requestedPage=null;}
 if(window.REMOTE_TRAY_HOST&&nativePage!==state.page){nativePage=state.page;call('window.page',{page:state.page}).catch(()=>{});}
 const titles={home:'ChatGPT Remote',settings:'设置',support:'联系与支持','support-qr':'支付宝收款码',update:'版本更新',install:'首次使用','first-use':'使用说明',uninstall:'卸载程序'},isHome=state.page==='home';
 $('#heading').textContent=titles[state.page]||titles.home;$('#heading').hidden=isHome;$('#homebar').hidden=!isHome;
 if(isHome)renderHomebar(s);
 $('#brand').hidden=!isHome;$('#back').hidden=['home','install'].includes(state.page);$('#settings').hidden=!['home','install'].includes(state.page);
 $('#settings').dataset.action=state.page==='install'?'exit-setup':'settings';$('#settings').setAttribute('aria-label',state.page==='install'?'退出':'设置');
 putContent($('#settings'),icon(state.page==='install'?'close':'settings'));$('#settings').dataset.update=String(s.update?.status==='available');
 main.dataset.page=state.page;main.setAttribute('aria-label',isHome?'远程连接面板':titles[state.page]||'ChatGPT Remote');
 if(isHome)renderHome(s);else putContent(main,({settings,support,'support-qr':supportQrView,update:lifecycleUpdate,install,'first-use':firstUse,uninstall}[state.page]||home)(s));
 // A home render replaces main outside putContent, so invalidate its subpage cache.
 if(isHome)renderedMarkup.delete(main);
 main.scrollTop=scroll;
 if(deviceMenuTrigger?.isConnected===false)closeDeviceMenu();
 const stale=statusIsStale(s);
 $('#footer-state').dataset.off=String(stale||!s.running||s.paused);$('#footer-state').textContent=stale?'状态待确认':state.starting?'本机服务启动中':s.running?(s.paused?'连接已暂停':'本机服务运行中'):'服务已停止';
 $('#status-retry').hidden=!isHome||!stale;$('#footer').hidden=state.page!=='update';$('#footer').dataset.page=state.page;
 if(state.page==='update')$('#footer-state').textContent='更新保留配对与设置';
 setBusy(state.busy);
 const editError=state.inline?.error||state.startError;$('#footer-state').dataset.error=String(!!editError);if(editError)$('#footer-state').textContent=editError;
 const renew=$('[data-action=renew-pair]');if(renew)renew.disabled=state.pairLoading;
 applyPreferences();updateExpiry();restoreFocus(focus);
}
function updateExpiry(){
 const node=$('#pair-expiry');if(!node||!state.pair||!state.status?.running||statusIsStale()||state.starting)return;
 const seconds=Math.max(0,Math.floor(state.pair.expiresAt-Date.now()/1000));node.textContent=seconds?`${seconds} 秒有效`:'已过期';
 const value=String(Math.min(60,seconds));node.style.setProperty('--p',value);if(node.parentElement)node.parentElement.style.setProperty('--p',value);
 if(!seconds){
  state.pair=null;
  if(state.panelVisible&&state.page==='home'&&!state.pairLoading&&!state.pairError)ensurePair(true);else render();
 }
}
async function ensurePair(renew=false){
 if(!state.panelVisible||state.page!=='home'||statusIsStale()||!state.status?.running||state.pairLoading||!renew&&state.pair&&state.pair.expiresAt>Date.now()/1000)return;
 const focus=rememberFocus();
 state.pairLoading=true;state.pairError=false;
 if(!state.pair||state.pair.expiresAt<=Date.now()/1000)state.pair=null;
 const generation=++state.pairGeneration;render();
 try{
  const result=await call('pair',{renew});
  if(generation!==state.pairGeneration||!state.panelVisible)return;
  if(!/^\d{6}$/.test(String(result.pin))||typeof result.qr!=='string'||!result.qr.startsWith('data:image/png;base64,')||!Number.isFinite(result.expiresAt)||result.expiresAt<=Date.now()/1000)throw new Error('配对信息不完整，请重新生成');
  state.pair={...result,pin:String(result.pin),deviceIds:(state.status.devices||[]).map(d=>d.id)};
 }catch(error){
  if(generation===state.pairGeneration){if(state.pair?.expiresAt<=Date.now()/1000)state.pair=null;state.pairError=true;toast(error.message,true);}
 }finally{
  if(generation===state.pairGeneration){
   state.pairLoading=false;
   if(state.page==='home'){
    render();
    if(focus?.action==='renew-pair'&&canFocusPanel()&&focusIsUnclaimed()){
     if(focus.node.isConnected)focus.node.focus({preventScroll:true});else restoreFocus(focus);
    }
   }
  }
 }
}
async function refresh(force=false) {
 if (!state.ready || state.busy || !force && (!state.panelVisible || document.hidden)) return;
 if (state.page === 'update' && state.status) return refreshRelease();
 if (refreshPending) return refreshPending;
 const ticket = prefWrites.readTicket(), previousUpdate = state.status?.update;
 const generation=statusGeneration;
 refreshPending = (async () => {
  try {
   const next = await call('status');
   if(generation!==statusGeneration)return;
   if (state.page === 'update' || state.status?.update !== previousUpdate) {
    next.update = state.status?.update ?? next.update;
   }
   prefWrites.reconcile(next.preferences || (next.preferences = {}), ticket);
   const previous = JSON.stringify(state.status), wasStale = statusIsStale();
   state.statusStale = false;
   if (state.pair?.deviceIds && (next.devices || []).some(d => !state.pair.deviceIds.includes(d.id))) {
    state.pair = null;
    toast('手机已连接');
   }
   state.status = next;
   if (state.settings === null && typeof next.autoStart === 'boolean') { state.settings = {autoStart: next.autoStart}; state.settingsAt = Date.now(); }
   if(next.running)state.startError='';
   if(state.inline?.id&&!(next.devices||[]).some(d=>d.id===state.inline.id))state.inline=null;
   if ((previous !== JSON.stringify(next) || wasStale) && !$('#dialog').open) render();
   if (!state.pairError) ensurePair();
  } catch (error) {
   if(generation!==statusGeneration)return;
   state.statusStale = true;
   if (state.status) {
    if (!$('#dialog').open) render();
   } else $('#main').innerHTML = '<div class="page"><div class="empty">无法读取服务状态</div><button class="secondary" data-action="retry">重新连接</button></div>';
  }
 })();
 try {
  await refreshPending;
 } finally {
  refreshPending = null;
 }
}
function updateStartupSwitch(){const value=state.settings?state.settings.autoStart:(typeof state.status?.autoStart==='boolean'?state.status.autoStart:null),button=$('[data-action=autostart]');if(button){button.setAttribute('aria-checked',String(!!value));button.hidden=value===null;button.disabled=value===null;}const loading=$('#startup-loading');if(loading)loading.hidden=value!==null;}
async function openSettings(force=false){go('settings');if(!force&&state.settings&&Date.now()-state.settingsAt<30000){updateStartupSwitch();return;}if(settingsPending)return settingsPending;const ticket=prefWrites.readTicket();settingsPending=(async()=>{try{const result=await call('settings.get');const values={...result.preferences,autoStart:result.autoStart};prefWrites.reconcile(values,ticket);state.settings={autoStart:values.autoStart};state.settingsAt=Date.now();state.status.preferences={...state.status.preferences,...values};applyPreferences();if(state.page==='settings')paintPreferences();}catch(error){toast(error.message,true);const loading=$('#startup-loading');if(loading){loading.disabled=false;loading.textContent='重试';loading.setAttribute('aria-label','重读开机自启状态');}}})();try{await settingsPending;}finally{settingsPending=null;}}
function showDialog({title,description='',value=null,confirm='保存',danger=false,submit}){$('#dialog-title').textContent=title;$('#dialog-description').textContent=description;$('#dialog-description').hidden=!description;const input=$('#dialog-input');input.hidden=value===null;input.value=value||'';$('#dialog-media').hidden=true;const button=$('#dialog button[type=submit]');button.hidden=false;button.textContent=confirm;button.classList.toggle('danger',danger);button.disabled=false;$('#dialog .dialog-error').hidden=true;dialogSubmit=submit;$('#dialog').showModal();window.RemoteMotion.pop($('#dialog'),'center');syncInteraction();if(value!==null){input.focus();input.select();}}
function showTargets(){
 if(!state.status?.running||statusIsStale())return;
 showDialog({title:'选择控制窗口'});
 $('#dialog button[type=submit]').hidden=true;
 $('#dialog-media').innerHTML=`<div class="target-options" role="radiogroup" aria-label="可用控制窗口">${(state.status.windows||[]).map(w=>`<button type="button" role="radio" aria-checked="${!!w.selected}" data-action="select-target" data-id="${esc(w.id)}" data-operation>${icon('monitor')}<span class="grow" title="${esc(w.title||'ChatGPT')}">${esc(w.title||'ChatGPT')}</span>${w.selected?icon('check'):''}</button>`).join('')}</div>`;
 $('#dialog-media').hidden=false;
 $('#dialog-media button[aria-checked=true]')?.focus({preventScroll:true});
}
$('#dialog').addEventListener('close',syncInteraction);
$('#dialog-form').addEventListener('submit',async event=>{event.preventDefault();const button=$('#dialog button[type=submit]');if(button.disabled||!dialogSubmit)return;button.disabled=true;setBusy(true);try{await dialogSubmit($('#dialog-input').value.trim());$('#dialog').close();}catch(error){$('#dialog .dialog-error').textContent=error.message;$('#dialog .dialog-error').hidden=false;}finally{button.disabled=false;setBusy(false);await refresh();render();}});
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-action]');
 if (deviceMenuTrigger && button?.dataset.action!=='device-menu' && !$('#device-menu').contains(event.target)) closeDeviceMenu();
 if(!button||button.disabled)return;const action=button.dataset.action;
 if(await lifecycleAction(action,button))return;
 if(action==='back'){back();return;}if(action==='dismiss'){hideToast();return;}if(action==='dialog-cancel'){$('#dialog').close();return;}
 if(action==='settings'){await openSettings();return;}if(action==='retry-settings'){await openSettings(true);return;}if(action==='retry'){await refresh(true);return;}
 if(action==='support'||action==='update'){go(action);return;}if(action==='update-notes'){state.releaseNotesOpen=!state.releaseNotesOpen;button.setAttribute('aria-expanded',String(state.releaseNotesOpen));$('#release-notes').hidden=!state.releaseNotesOpen;return;}if(action==='appearance'){state.appearanceOpen=!state.appearanceOpen;button.setAttribute('aria-expanded',String(state.appearanceOpen));window.RemoteMotion.reveal($('#appearance-body'),state.appearanceOpen);return;}
 if(action==='pref'){prefWrites.set(button.dataset.key,button.dataset.value);return;}if(action==='autostart'){prefWrites.set('autoStart',!state.settings?.autoStart);return;}
 if(action==='motion'){prefWrites.set('motion',state.status?.preferences?.motion===false);return;}
 if(action==='computer-name'){beginInline('computer');return;}if(action==='cancel-inline'){cancelInline();return;}if(action==='confirm-remove'){await saveInline();return;}
 if(action==='copy-code'){if(state.pair)await operate('pair.copy',{pin:state.pair.pin},'已复制');return;}
 if(action==='renew-pair'){await ensurePair(true);return;}if(action==='copy-link'){await operate('link.copy',{},'链接已复制');return;}
 if(action==='add-device'){guidePairing();return;}
 if(action==='device-menu'){toggleDeviceMenu(button);return;}
 if(action==='rename'||action==='remove'){
  const id=deviceMenuTrigger?.dataset.id;
  closeDeviceMenu();
  const device=state.status.devices.find(d=>d.id===id);
  if(!device||!state.status.running||statusIsStale())return;
  beginInline(action,device);
  return;
 }
 if(action==='choose-target'){showTargets();return;}
 if(action==='select-target'){
  if(state.busy||button.getAttribute('aria-checked')==='true')return;
  if(!state.status?.running||statusIsStale()){const field=$('#dialog .dialog-error');field.textContent='连接恢复后再试';field.hidden=false;return;}
  statusGeneration++;
  setBusy(true);
  try{const result=await call('target.select',{id:Number(button.dataset.id)});state.status={...state.status,...result};$('#dialog').close();render();if(canFocusPanel())$('[data-action=choose-target]')?.focus({preventScroll:true});}
  catch(error){const field=$('#dialog .dialog-error');field.textContent=error.message;field.hidden=false;}
  finally{setBusy(false);}
  return;
 }
 if(action==='start'){await startService();return;}
 if(['github','issues','releases'].includes(action)){await operate('links.open',{page:action});return;}if(action==='copy-qq'){await operate('support.copy',{},'QQ 号已复制');return;}
 if(action==='support-qr'){go('support-qr');return;}
});
$('#main').addEventListener('scroll',()=>closeDeviceMenu(),{passive:true});
window.addEventListener('resize',positionDeviceMenu);
window.addEventListener('blur',()=>closeDeviceMenu());
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&state.inline){event.preventDefault();cancelInline();return;}
 if (deviceMenuTrigger) {
  if (event.key==='Escape'||event.key==='Tab') {
   if (event.key==='Escape') event.preventDefault();
   closeDeviceMenu(true);
   return;
  }
  const items=[...$('#device-menu').querySelectorAll('button')];
  const index=items.indexOf(document.activeElement);
  const next={ArrowDown:(index+1)%items.length,ArrowUp:(index+items.length-1)%items.length,Home:0,End:items.length-1}[event.key];
  if (next!==undefined) {event.preventDefault();items[next].focus({preventScroll:true});}
  return;
 }
 if (event.key==='Escape'&&!$('#dialog').open) {
  event.preventDefault();
  if(!['home','install'].includes(state.page)) back(); else call('window.close').catch(()=>{});
 }
});
function stopPolling(){clearInterval(refreshTimer);clearInterval(expiryTimer);refreshTimer=expiryTimer=null;}
function startPolling(){stopPolling();if(state.panelVisible){refreshTimer=setInterval(refresh,state.page==='update'?800:4000);expiryTimer=setInterval(updateExpiry,1000);}}
function syncUpdatePolling(previous){
 if ((previous==='update')===(state.page==='update')) return;
 startPolling();
 if (state.page==='update') refreshRelease();
}
async function initialize(){if(state.ready)return;state.ready=true;const initial=refresh(true);try{await call('window.ready');}catch(error){toast(error.message,true);}await initial;startPolling();}
$('#back').innerHTML=icon('back');$('#settings').innerHTML=icon('settings');$('#toast button').innerHTML=icon('close');
$('#device-menu [data-action=rename]').insertAdjacentHTML('afterbegin',icon('edit'));
$('#device-menu [data-action=remove]').insertAdjacentHTML('afterbegin',icon('trash'));
window.remoteShown=()=>{state.panelVisible=true;state.inline=null;state.page='home';state.history=[];state.appearanceOpen=false;state.releaseNotesOpen=false;closeDeviceMenu();render();$('#main').scrollTop=0;refresh();ensurePair();startPolling();window.RemoteMotion.open($('#shell'));};
window.remoteHidden=()=>{state.panelVisible=false;state.inline=null;state.pair=null;state.pairGeneration++;state.pairLoading=false;closeDeviceMenu();state.appearanceOpen=false;state.releaseNotesOpen=false;stopPolling();window.RemoteMotion.stop();clearTimeout(toastTimer);$('#toast').hidden=true;if($('#dialog').open)$('#dialog').close();};
window.addEventListener('pywebviewready',initialize);if(window.pywebview?.api)initialize();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script>
