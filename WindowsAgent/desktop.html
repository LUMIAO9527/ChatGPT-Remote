window.remoteBackdrop=mode=>{document.documentElement.dataset.material=mode==='solid'?'solid':'glass';};
themeQuery.addEventListener('change',applyPreferences);
function paintPreferences(){const pref=state.status?.preferences||{};const summary=$('#appearance-summary');if(summary)summary.textContent=({system:'系统',light:'浅色',dark:'深色'})[pref.theme]||'系统';for(const group of document.querySelectorAll('[data-pref-group]')){const buttons=[...group.querySelectorAll('[data-value]')],index=Math.max(0,buttons.findIndex(b=>b.dataset.value===String(pref[group.dataset.prefGroup])));group.style.setProperty('--segment-index',index);buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));}updateStartupSwitch();}
function go(page){if(state.page!==page){state.history.push(state.page);state.page=page;state.appearanceOpen=false;state.releaseNotesOpen=false;}render();$('#main').scrollTop=0;window.RemoteMotion.enter($('#main'),1);if(page==='home')ensurePair();}
function back(){state.page=state.history.pop()||'home';state.appearanceOpen=false;state.releaseNotesOpen=false;render();$('#main').scrollTop=0;window.RemoteMotion.enter($('#main'),-1);if(state.page==='home')ensurePair();}
function segment(key,options,value){const index=Math.max(0,options.findIndex(([id])=>id===value));return `<div class="segmented" data-pref-group="${key}" role="group" aria-label="${key==='theme'?'外观':'窗口材质'}" style="--segment-count:${options.length};--segment-index:${index}">${options.map(([id,label])=>`<button data-action="pref" data-key="${key}" data-value="${id}" aria-pressed="${id===value}">${label}</button>`).join('')}</div>`;}
function pairCard(s){if(statusIsStale(s))return `<section class="card pair-card"><div class="pair-skeleton">${icon('qr')}</div><div class="pair-copy"><strong>连接手机</strong><small>状态待确认</small><button class="secondary" data-action="retry">重试</button></div></section>`;if(!s.running)return `<section class="card pair-card"><div class="pair-skeleton">${icon('phone')}</div><div class="pair-copy"><strong>连接手机</strong><small>服务已停止</small><button class="primary" data-action="start" data-operation>启动服务</button></div></section>`;const p=state.pair;return `<section class="card pair-card">${p?`<div class="qr-frame"><img src="${esc(p.qr)}" alt="手机连接二维码"></div>`:`<div class="pair-skeleton">${icon('qr')}</div>`}<div class="pair-copy"><strong>连接手机</strong>${s.computerName?`<span class="pair-note" title="${esc(s.computerName)}">${esc(s.computerName)}</span>`:''}<span class="pair-label">配对码</span><span class="pair-code">${p?esc(p.pin.slice(0,3)+' '+p.pin.slice(3)):'··· ···'}</span><div class="pair-tools"><small id="pair-expiry">${state.pairError?'生成失败':p?'':'正在准备…'}</small><button class="text-action" data-action="renew-pair" ${state.pairLoading?'disabled':''}>${state.pairError?'重试':'换配对码'}</button></div></div></section>`;}
function windowRows(s){if(!s.running)return '<div class="empty">服务启动后连接窗口</div>';if(!(s.windows||[]).length)return '<div class="empty">打开 ChatGPT 后自动连接</div>';return `<div role="radiogroup" aria-label="控制窗口">${(s.windows||[]).map(w=>`<button class="row target-entry ${w.selected?'selected':''}" role="radio" aria-checked="${!!w.selected}" data-action="select-target" data-id="${esc(w.id)}" data-operation>${icon('monitor')}<span class="grow"><strong class="window-title">${esc(w.title||'ChatGPT')}</strong><small>${w.selected?'正在控制':'点击连接此窗口'}</small></span><span class="selection">${w.selected?icon('check','check'):''}</span></button>`).join('')}</div>`;}
function deviceRows(devices){return devices.map(d=>`<div class="device-item"><div class="device-line"><span class="device-icon">${icon('phone')}</span><span class="grow"><strong class="ellipsis">${esc(d.name)}</strong><small>${deviceDate(d.created)}</small></span><button class="icon" data-action="device-menu" data-id="${esc(d.id)}" aria-label="管理 ${esc(d.name)}" aria-expanded="${state.menuDevice===d.id}">${icon('more')}</button></div><div class="device-menu" data-device-menu="${esc(d.id)}" ${state.menuDevice===d.id?'':'hidden'}><button data-action="rename" data-id="${esc(d.id)}" ${state.status.running?'':'disabled'}>重命名</button><button class="danger" data-action="remove" data-id="${esc(d.id)}" ${state.status.running?'':'disabled'}>移除设备</button></div></div>`).join('');}
function deviceDate(created){if(!created)return '已配对';const d=new Date(created*1000);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 配对`;}
function home(s){const windows=s.windows||[],devices=s.devices||[];return `<div class="page">${pairCard(s)}${s.phoneUrl?`<div class="connection-line"><span>${esc(s.phoneUrl.replace(/^https?:\/\//,'').replace(/\/$/,''))}</span><button class="icon" data-action="copy-link" data-operation aria-label="复制手机连接链接" title="复制连接链接">${icon('copy')}</button></div>`:''}<section class="group"><div class="section-label">控制窗口${windows.length>1?`<span>${windows.length} 个</span>`:''}</div>${windowRows(s)}</section><section class="group"><div class="section-label">已配对设备<span>${devices.length}</span></div>${devices.length?deviceRows(devices):'<div class="empty">暂无设备</div>'}</section></div>`;}
function settings(s){const pref=s.preferences||{},appearance=state.appearanceOpen;return `<div class="page"><section class="group"><div class="section-label">系统</div><div class="settings-list"><div class="toggle-row"><span class="grow">开机自启</span><button id="startup-loading" class="text-action" data-action="retry-settings" aria-label="读取开机自启状态" disabled ${state.settings?'hidden':''}>读取中…</button><button class="switch" role="switch" aria-label="开机自启" aria-checked="${!!state.settings?.autoStart}" data-action="autostart" ${state.settings?'':'hidden disabled'}></button></div><section class="disclosure"><button class="link-row" data-action="appearance" aria-expanded="${appearance}"><span class="grow">外观</span><span id="appearance-summary" class="end">${({system:'系统',light:'浅色',dark:'深色'})[pref.theme]||'系统'}</span>${icon('right')}</button><div class="disclosure-body" id="appearance-body" ${appearance?'':'hidden'}>${segment('theme',[['system','系统'],['light','浅色'],['dark','深色']],pref.theme||'system')}${segment('material',[['glass','磨砂玻璃'],['solid','纯色']],pref.material||'glass')}</div></section></div></section><section class="group"><div class="section-label">关于</div><div class="settings-list"><button class="link-row" data-action="update"><span class="grow">版本更新</span><span class="end">${s.update?.status==='available'?'有新版本':''}</span>${icon('right')}</button><button class="link-row" data-action="first-use"><span class="grow">使用说明</span>${icon('right')}</button><button class="link-row" data-action="support"><span class="grow">联系与支持</span>${icon('right')}</button><button class="link-row" data-action="uninstall"><span class="grow">卸载程序</span>${icon('right')}</button></div></section></div>`;}
function support(s){return `<div class="purchase-page"><section class="purchase-contact"><h3>咨询</h3><p class="purchase-services">使用咨询 · 问题反馈</p><div class="purchase-number"><label for="support-qq">QQ号：</label><input id="support-qq" class="purchase-qq" aria-label="QQ号" value="210037309" readonly spellcheck="false"></div><p class="purchase-note">添加时请备注“ChatGPT Remote”</p><button class="primary purchase-copy" data-action="copy-qq">${icon('copy')}复制 QQ 号</button><button class="purchase-feedback" data-action="issues">在 GitHub 反馈问题</button></section><section class="card support-card"><div class="support-copy"><h3>打赏作者</h3><p>如果这个工具帮到了你，<br>欢迎随意打赏。</p><p class="support-scan">支付宝 · 点击放大</p></div><button class="support-code" data-action="support-qr" aria-label="放大支付宝打赏码"><img src="${supportQr}" alt="支付宝打赏码"></button></section></div>`;}
function supportQrView(){return `<div class="page"><img class="support-full-code" src="${supportQr}" alt="支付宝收款二维码"><p class="purchase-note" style="text-align:center">打开支付宝扫一扫</p></div>`;}
function update(s){const u=s.update||{},checking=u.status==='checking';const message={idle:'检查是否有新版本',checking:'正在检查更新…',current:'当前已是最新版本',available:'发现可用更新',error:'无法连接 GitHub'}[u.status]||'检查是否有新版本';return `<div class="update-page"><section class="update-identity"><span class="brand">${$('#brand').innerHTML}</span><h3 class="update-brand">ChatGPT Remote</h3><p class="update-version">当前版本 ${esc(s.version)}</p><button class="update-github" data-action="github">GitHub 项目 ${icon('external')}</button></section><button class="primary" data-action="${u.status==='available'?'releases':'check-update'}" ${checking?'disabled':''}>${u.status==='available'?'下载更新':checking?'正在检查…':u.status==='error'?'重试':'检查更新'}</button><section class="update-state"><h3 class="update-message">${message}</h3><div class="update-description">${u.notes?`<button class="update-notes-toggle" data-action="update-notes" aria-expanded="${!!state.releaseNotesOpen}">版本 ${esc(u.version)}${icon('right')}</button>`:u.status==='available'?'版本 '+esc(u.version):''}</div><div id="release-notes" class="update-notes-body" ${state.releaseNotesOpen?'':'hidden'}>${esc(u.notes||'')}</div></section></div>`;}
/*REMOTE_LIFECYCLE*/
function render(){const s=state.status;if(!s)return;if(s.installation?.firstRun){state.page='install';state.history=[];}else if(s.requestedPage){state.page=s.requestedPage;s.requestedPage=null;}if(window.REMOTE_TRAY_HOST&&nativePage!==state.page){nativePage=state.page;call('window.page',{page:state.page}).catch(()=>{});}const titles={home:'ChatGPT Remote',settings:'设置',support:'联系与支持','support-qr':'支付宝收款码',update:'版本更新',install:'首次使用','first-use':'使用说明',uninstall:'卸载程序'};$('#heading').textContent=titles[state.page]||titles.home;$('#brand').hidden=state.page!=='home';$('#back').hidden=['home','install'].includes(state.page);$('#settings').hidden=!['home','install'].includes(state.page);$('#settings').dataset.action=state.page==='install'?'exit-setup':'settings';$('#settings').setAttribute('aria-label',state.page==='install'?'退出':'设置');$('#settings').innerHTML=icon(state.page==='install'?'close':'settings');$('#settings').dataset.update=String(s.update?.status==='available');$('#main').dataset.page=state.page;const scroll=$('#main').scrollTop;$('#main').innerHTML=({home,settings,support,'support-qr':supportQrView,update:lifecycleUpdate,install,'first-use':firstUse,uninstall}[state.page]||home)(s);$('#main').scrollTop=scroll;const stale=statusIsStale(s);$('#footer-state').dataset.off=String(stale||!s.running||s.paused);$('#footer-state').textContent=stale?'状态待确认':s.running?(s.paused?'连接已暂停':'本机服务运行中'):'服务已停止';$('#status-retry').hidden=state.page!=='home'||!stale;$('#footer').hidden=!['home','update'].includes(state.page);$('#footer').dataset.page=state.page;if(state.page==='update')$('#footer-state').textContent='更新保留配对与设置';setBusy(state.busy);applyPreferences();updateExpiry();}
function updateExpiry(){const node=$('#pair-expiry');if(node&&state.pair){const seconds=Math.max(0,Math.floor(state.pair.expiresAt-Date.now()/1000));node.textContent=seconds?`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')} 有效`:'已过期';if(!seconds&&state.panelVisible&&state.page==='home'&&!state.pairLoading&&!state.pairError)ensurePair(true);}}
async function ensurePair(renew=false){if(!state.panelVisible||state.page!=='home'||statusIsStale()||!state.status?.running||state.pairLoading||!renew&&state.pair&&state.pair.expiresAt>Date.now()/1000)return;state.pairLoading=true;state.pairError=false;state.pair=null;const generation=++state.pairGeneration;render();try{const result=await call('pair',{renew});if(generation!==state.pairGeneration||!state.panelVisible)return;if(!/^\d{6}$/.test(String(result.pin))||typeof result.qr!=='string'||!result.qr.startsWith('data:image/png;base64,')||!Number.isFinite(result.expiresAt)||result.expiresAt<=Date.now()/1000)throw new Error('配对信息不完整，请重新生成');state.pair={...result,pin:String(result.pin),deviceIds:(state.status.devices||[]).map(d=>d.id)};}catch(error){if(generation===state.pairGeneration){state.pairError=true;toast(error.message,true);}}finally{if(generation===state.pairGeneration){state.pairLoading=false;if(state.page==='home')render();}}}
async function refresh(force=false){if(!state.ready||state.busy||!force&&(!state.panelVisible||document.hidden))return;if(refreshPending)return refreshPending;const ticket=prefWrites.readTicket();refreshPending=(async()=>{try{const next=await call('status');prefWrites.reconcile(next.preferences||(next.preferences={}),ticket);const previous=JSON.stringify(state.status),wasStale=statusIsStale();state.statusStale=false;if(state.pair?.deviceIds&&(next.devices||[]).some(d=>!state.pair.deviceIds.includes(d.id))){state.pair=null;toast('手机已连接');}state.status=next;if((previous!==JSON.stringify(next)||wasStale)&&!$('#dialog').open)render();if(!state.pairError)ensurePair();}catch(error){const wasStale=statusIsStale();state.statusStale=true;if(state.status){if(!$('#dialog').open)render();}else $('#main').innerHTML='<div class="page"><div class="empty">无法读取服务状态</div><button class="secondary" data-action="retry">重新连接</button></div>';if(state.panelVisible&&!wasStale)toast(error.message,true);}})();try{await refreshPending;}finally{refreshPending=null;}}
function updateStartupSwitch(){const button=$('[data-action=autostart]');if(button){button.setAttribute('aria-checked',String(!!state.settings?.autoStart));button.hidden=!state.settings;button.disabled=!state.settings;}const loading=$('#startup-loading');if(loading)loading.hidden=!!state.settings;}
async function openSettings(force=false){go('settings');if(!force&&state.settings&&Date.now()-state.settingsAt<30000){updateStartupSwitch();return;}if(settingsPending)return settingsPending;const ticket=prefWrites.readTicket();settingsPending=(async()=>{try{const result=await call('settings.get');const values={...result.preferences,autoStart:result.autoStart};prefWrites.reconcile(values,ticket);state.settings={autoStart:values.autoStart};state.settingsAt=Date.now();state.status.preferences={...state.status.preferences,...values};applyPreferences();if(state.page==='settings')paintPreferences();}catch(error){toast(error.message,true);const loading=$('#startup-loading');if(loading){loading.disabled=false;loading.textContent='重试';loading.setAttribute('aria-label','重读开机自启状态');}}})();try{await settingsPending;}finally{settingsPending=null;}}
function showDialog({title,description='',value=null,confirm='保存',danger=false,submit}){$('#dialog-title').textContent=title;$('#dialog-description').textContent=description;$('#dialog-description').hidden=!description;const input=$('#dialog-input');input.hidden=value===null;input.value=value||'';$('#dialog-media').hidden=true;const button=$('#dialog button[type=submit]');button.hidden=false;button.textContent=confirm;button.classList.toggle('danger',danger);button.disabled=false;$('#dialog .dialog-error').hidden=true;dialogSubmit=submit;$('#dialog').showModal();syncInteraction();if(value!==null){input.focus();input.select();}}
$('#dialog').addEventListener('close',syncInteraction);
$('#dialog-form').addEventListener('submit',async event=>{event.preventDefault();const button=$('#dialog button[type=submit]');if(button.disabled||!dialogSubmit)return;button.disabled=true;setBusy(true);try{await dialogSubmit($('#dialog-input').value.trim());$('#dialog').close();}catch(error){$('#dialog .dialog-error').textContent=error.message;$('#dialog .dialog-error').hidden=false;}finally{button.disabled=false;setBusy(false);await refresh();render();}});
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
 if(await lifecycleAction(action,button))return;
 if(action==='back'){back();return;}if(action==='dismiss'){$('#toast').hidden=true;return;}if(action==='dialog-cancel'){$('#dialog').close();return;}
 if(action==='settings'){await openSettings();return;}if(action==='retry-settings'){await openSettings(true);return;}if(action==='retry'){await refresh(true);return;}
 if(action==='support'||action==='update'){go(action);return;}if(action==='update-notes'){state.releaseNotesOpen=!state.releaseNotesOpen;button.setAttribute('aria-expanded',String(state.releaseNotesOpen));$('#release-notes').hidden=!state.releaseNotesOpen;return;}if(action==='appearance'){state.appearanceOpen=!state.appearanceOpen;button.setAttribute('aria-expanded',String(state.appearanceOpen));window.RemoteMotion.reveal($('#appearance-body'),state.appearanceOpen);return;}
 if(action==='pref'){prefWrites.set(button.dataset.key,button.dataset.value);return;}if(action==='autostart'){prefWrites.set('autoStart',!state.settings?.autoStart);return;}
 if(action==='renew-pair'){await ensurePair(true);return;}if(action==='copy-link'){await operate('link.copy',{},'链接已复制');return;}
 if(action==='device-menu'){state.menuDevice=state.menuDevice===button.dataset.id?null:button.dataset.id;button.setAttribute('aria-expanded',String(state.menuDevice===button.dataset.id));window.RemoteMotion.reveal($('[data-device-menu="'+button.dataset.id+'"]'),state.menuDevice===button.dataset.id);return;}
 if(action==='rename'||action==='remove'){const d=state.status.devices.find(d=>d.id===button.dataset.id);if(!d)return;if(action==='rename')showDialog({title:'重命名设备',value:d.name,submit:async name=>{if(!name)throw new Error('请输入设备名称');await call('device.rename',{id:d.id,name});}});else showDialog({title:'移除设备？',description:d.name+' 将需要重新配对。',confirm:'移除',danger:true,submit:()=>call('device.remove',{id:d.id})});return;}
 if(action==='select-target'){if(button.getAttribute('aria-checked')==='true')return;const r=await operate('target.select',{id:Number(button.dataset.id)});if(r)state.status={...state.status,...r};render();return;}
 if(action==='start'){button.textContent='启动中…';const r=await operate('service.start');if(r)state.status={...state.status,...r};render();ensurePair();return;}
 if(['github','issues','releases'].includes(action)){await operate('links.open',{page:action});return;}if(action==='copy-qq'){await operate('support.copy',{},'QQ 号已复制');return;}
 if(action==='check-update'){state.status.update={...state.status.update,status:'checking'};render();try{const r=await call('updates.check');state.status.update=r.update;}catch(error){state.status.update={status:'error'};}if(state.page==='update')render();return;}
 if(action==='support-qr'){go('support-qr');return;}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#dialog').open){event.preventDefault();if(!['home','install'].includes(state.page))back();else call('window.close').catch(()=>{});}});
function stopPolling(){clearInterval(refreshTimer);clearInterval(expiryTimer);refreshTimer=expiryTimer=null;}
function startPolling(){stopPolling();if(state.panelVisible){refreshTimer=setInterval(refresh,4000);expiryTimer=setInterval(updateExpiry,1000);}}
async function initialize(){if(state.ready)return;state.ready=true;const initial=refresh(true);try{await call('window.ready');}catch(error){toast(error.message,true);}await initial;startPolling();}
$('#back').innerHTML=icon('back');$('#settings').innerHTML=icon('settings');$('#toast button').innerHTML=icon('close');
window.remoteShown=()=>{state.panelVisible=true;state.page='home';state.history=[];state.appearanceOpen=false;state.releaseNotesOpen=false;state.menuDevice=null;render();$('#main').scrollTop=0;refresh();ensurePair();startPolling();window.RemoteMotion.enter($('#main'));};
window.remoteHidden=()=>{state.panelVisible=false;state.pair=null;state.pairGeneration++;state.pairLoading=false;state.menuDevice=null;state.appearanceOpen=false;state.releaseNotesOpen=false;stopPolling();window.RemoteMotion.stop();clearTimeout(toastTimer);$('#toast').hidden=true;if($('#dialog').open)$('#dialog').close();};
window.addEventListener('pywebviewready',initialize);if(window.pywebview?.api)initialize();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script>
</body>
