<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rm · 手机界面评审</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceef2;color:#1c1e23;font:14px/1.5 'HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif}header{padding:18px 28px;background:#f7f8fa;border-bottom:1px solid #dfe3e9;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:19px;letter-spacing:-.4px;margin:0}header p{font-size:12px;color:#737983;margin:3px 0 0}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}label{display:flex;align-items:center;gap:7px;font-size:12px;color:#626973}select,button,summary{font:inherit}select,button{min-height:40px;background:#fff;border:1px solid #d9dde4;border-radius:11px;padding:8px 10px;color:inherit;cursor:pointer}button:hover{background:#f0f2f6}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #0a59f7;outline-offset:3px}main{max-width:940px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:54px;padding:24px 32px 16px;align-items:start}.caption{display:flex;gap:12px;align-items:baseline;margin:0 auto 12px;width:390px;max-width:100%}.caption h2{font-size:14px;font-weight:600;margin:0}.caption span{font-size:12px;color:#747b85}iframe{display:block;background:#fff;border:0;border-radius:20px;outline:1px solid #dce0e6;box-shadow:0 10px 36px #1721310b;margin:0 auto}.mobile{width:390px;height:780px}.mobile.narrow{width:320px}.mobile.reference{width:360px}.mobile.keyboard{height:510px}.mobile.tablet{width:700px;height:760px}body.tablet main{max-width:1240px;grid-template-columns:360px 1fr;gap:30px}body.tablet #home{width:360px}.notes{max-width:890px;margin:0 auto;padding:6px 24px;color:#717984;font-size:12px;line-height:1.8}.feedback{min-height:34px;max-width:890px;margin:0 auto;padding:6px 24px;font-size:12px;color:#626973}.desktop-review{max-width:876px;margin:8px auto 36px}.desktop-review>summary{color:#626973;cursor:pointer;min-height:44px;padding:10px 14px;border:1px solid #d9dde4;border-radius:12px;font-size:13px;background:#f7f8fa;list-style:none}.desktop-review>summary::after{content:'＋';float:right}.desktop-review[open]>summary::after{content:'−'}.desktop-review>div{padding:20px}.desktop{width:312px;height:458px;border-radius:16px}.desktop-review p{font-size:12px;color:#737983;text-align:center}.dark{background:#0e1015;color:#edf0f5}.dark header,.dark .desktop-review>summary{background:#191c23;border-color:#303641}.dark select,.dark button{background:#242a33;border-color:#363e4a;color:#edf0f5}.dark header p,.dark label,.dark .caption span,.dark .notes,.dark .feedback,.dark .desktop-review>summary,.dark .desktop-review p{color:#abb3be}.dark iframe{outline-color:#333b46}@media(max-width:920px){header{padding:14px 18px}.controls{margin-left:0}main,body.tablet main{grid-template-columns:1fr;gap:28px;padding:22px 10px}.mobile{max-width:calc(100vw - 28px)}.caption{width:390px}.desktop-review{margin-left:16px;margin-right:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><div><h1>Rm · 手机界面评审</h1><p>真实页面模板 · 模拟连接与内容</p></div><div class="controls"><label>对话场景<select id="scenario"><option value="queue">回复与排队</option><option value="chat">日常对话</option><option value="paused">队列暂停</option><option value="long">长文阅读</option><option value="draft">电脑草稿</option><option value="pair">首次配对</option><option value="approval">电脑审批</option><option value="offline">连接中断</option></select></label><label>外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>视口<select id="size"><option value="normal">390 px</option><option value="reference">360 px 参考尺寸</option><option value="narrow">320 px</option><option value="keyboard">缩短视口</option><option value="tablet">700 px</option></select></label><button id="reset">重置</button></div></header>
<main><section><div class="caption"><h2>设备首页</h2><span>点击电脑进入</span></div><iframe id="home" class="mobile" title="手机设备首页" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></section><section><div class="caption"><h2>对话</h2><span>模型、项目、队列均可点击</span></div><iframe id="mobile" class="mobile" title="手机对话交互演示" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></section></main>
<div class="feedback" id="feedback" role="status">配对示例码 246810。演示不会连接真实电脑。</div><p class="notes">缩短视口用于检查输入区空间，不等于华为输入法实测。所有对话、设备、配对码及更新状态均为模拟。</p>
<details class="desktop-review" id="desktopReview"><summary>查看电脑端 · 保留原有风格</summary><div><iframe id="desktop" class="desktop" title="电脑原有托盘界面" sandbox="allow-scripts allow-same-origin allow-forms"></iframe><p>安装、更新与卸载仅展示交互，不会改动电脑。</p></div></details>
<script>
/*REVIEW_PAYLOAD*/
const $=id=>document.getElementById(id);
function mount(id,type,scenario){const theme=$('theme').value,config=JSON.stringify({theme,scenario,qr:payload.qr,frame:payload.frame,version:payload.version});const injection='<script>window.RM_REVIEW_CONFIG='+config+';<\/script><script>'+payload.fixtures+'<\/script>';const html=type==='mobile'?payload[type].replace(/@media\s*\(prefers-color-scheme:\s*dark\)/g,theme==='dark'?'@media all':'@media not all'):payload[type];$(id).srcdoc=html.replace('<head>','<head>'+injection);}
function refresh(){document.body.classList.toggle('dark',$('theme').value==='dark');mount('home','mobile','home');mount('mobile','mobile',$('scenario').value);if($('desktopReview').open)mount('desktop','desktop','chat');$('feedback').textContent='配对示例码 246810。演示不会连接真实电脑。';}
$('theme').onchange=refresh;$('scenario').onchange=()=>mount('mobile','mobile',$('scenario').value);$('reset').onclick=refresh;
$('size').onchange=()=>{for(const id of ['home','mobile'])$(id).className='mobile '+$('size').value;document.body.classList.toggle('tablet',$('size').value==='tablet');};
$('desktopReview').ontoggle=()=>{if($('desktopReview').open&&!$('desktop').srcdoc)mount('desktop','desktop','chat');};
window.addEventListener('message',event=>{if(!['home','mobile','desktop'].some(id=>$(id).contentWindow===event.source)||event.data?.type!=='rm-review')return;$('feedback').textContent=event.data.message;});refresh();
</script></body></html>
