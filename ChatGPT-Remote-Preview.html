interdown',function(event){\n      if(event.pointerType==='mouse' && event.button!==0)return;\n      held=false;clearTimeout(timer);\n      timer=setTimeout(function(){held=true;toast(button.getAttribute('aria-label'));},500);\n    });\n    button.addEventListener('pointerup',function(){clearTimeout(timer);});\n    button.addEventListener('pointercancel',function(){clearTimeout(timer);held=false;});\n    button.addEventListener('pointerleave',function(){clearTimeout(timer);held=false;});\n    button.addEventListener('click',function(event){if(held){held=false;event.preventDefault();event.stopImmediatePropagation();}},true);\n  }\n  function readToken(){\n    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }\n  }\n  function writeToken(token){\n    try {\n      if (token) localStorage.setItem(TOKEN_KEY, token);\n      else localStorage.removeItem(TOKEN_KEY);\n    } catch (e) { /* 隐私模式下忽略 */ }\n  }\n  function restorePhonePreferences(){\n    try {\n      var value=JSON.parse(localStorage.getItem(SURFACE_KEY)||'{}');\n      state.autoResume=value.autoResume!==false;\n      state.lastSurface='remote';\n      state.view='chat';\n    } catch(e) { state.autoResume=true;state.lastSurface='remote';state.view='chat'; }\n  }\n  function savePhoneSurface(surface){\n    state.lastSurface='remote';\n    try {localStorage.setItem(SURFACE_KEY,JSON.stringify({autoResume:state.autoResume,lastSurface:'remote',view:state.view}));}catch(e) { /* private browsing */ }\n  }\n  function renderConnectionHome(){\n    els.homeOpenLabel.textContent='点击进入';\n    els.homeComputerName.textContent=state.computerName||'我的主电脑';\n    els.settingsComputerName.textContent=state.computerName;\n    var target=state.windows.find(function(item){return item.selected;});\n    var ready=state.live && !state.networkTrouble && isStatusAllowed(state.status);\n    var needsWindow=state.status==='ambiguous' || state.status==='not_selected';\n    els.homeStatus.textContent=ready?'已连接':st
